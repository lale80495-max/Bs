name: Build NOVA Aim Assist

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build NOVA
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Aim-Assist-1.21.11
          path: build/libs/*.jar
          
